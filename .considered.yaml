# File standards for hand-written code (docs/maintainers/file-standards.md). `considered variance add` rewrites
# this file without its comments; add variances by hand, or restore the comments after.
kinds:
  - cohesion
  - declarative
exclude:
  gitignored: true
  categories:
    - tests
    - vendored
    - dependencies
    - generated
    - assets
    - configuration
  # Generated outputs (tools/cli/src/lib/generated.ts), fixture data and other data the categories don't cover. Rust test
  # modules live in tests.rs files. packages/cli/src/fixtures and packages/host/inspector/src/fixtures are source and stay measured.
  paths:
    - 'examples/comparators/*/fixtures/**'
    - 'packages/comparators/*/fixtures/**'
    # `terraform show -json` output, the input of the README gallery's infrastructure image.
    - 'docs/images/sources/encrypt-database/*/plan.json'
    - 'packages/host/vscode-ui/fixtures/**'
    - 'packages/renderers/*/fixtures/**'
    - 'packages/renderers/harness/browser/fixtures/**'
    - 'packages/schemas/fixtures/**'
    - '**/snapshots/**'
    - '**/tests.rs'
    - '**/scenarios.json'
    - '**/*.generated.ts'
    # Generated from packages/sdk/src/extractor.ts, which is measured.
    - 'packages/cli/node/extractor.mjs'
    - 'packages/schemas/schemas/**'
    - 'docs/reference/**'
    - 'docs/agents/**'
    - 'packages/comparators/rules/language.json'
    - '.github/workflows/release.yml'
    - '.github/ci-rules.schema.json'
    - 'tools/cli/test/ci-plan.cases.schema.json'
    - 'docs/maintainers/ci-plan.md'
    - 'packages/host/vscode-ui/THIRD_PARTY_NOTICES.md'
    - 'packages/renderers/sdk/vendor/**'
    # Pristine shadcn/ui registry items, the base of the three-way merge in packages/host/core/scripts/shadcn/update.mjs.
    - 'packages/host/core/src/ui/components/upstream/**'
    # A comparator is one file by design (one file is one comparator and its digest; the format has no include), so
    # its size follows the rules it holds rather than how the code is organised.
    - '**/*.comparator.yaml'
    # A design record is one decision, read end to end, so it stays one page however long the decision is.
    - 'docs/design/**'
    # An agent skill is a prompt, read whole by an agent; its length and line breaks follow the guidance it gives.
    - '**/SKILL.md'
    - '**/skills/**'
standards:
  filesystem.bytes:
    max: 50000
  # The formatters wrap at 140 (oxfmt, rustfmt; Markdown prose at 80). This is only a backstop for what they
  # can't wrap: it catches minified, pasted or generated-looking content, not long string literals or tables.
  filesystem.longest_line:
    max: 400
  scc.code_lines:
    max: 500
  # Branches and loops summed over the file. A file above it usually holds more than one responsibility.
  scc.complexity:
    max: 60
warnings:
  percentBelowMax: 10
  percentAboveMin: 10
variances:
  CHANGELOG.md:
    kind: declarative
    reason: "Release notes, unwrapped on purpose (proseWrap: never in .oxfmtrc.json): each paragraph and list item is one line, because dist copies a version's section into its GitHub release body, where a single line break can render as a break mid-sentence (docs/maintainers/releasing.md#release-notes). Split a longer entry into sub-items."
    metrics:
      filesystem.longest_line:
        max: 1000
  packages/cli/src/tools/catalog.rs:
    kind: declarative
    reason: "Agent tool descriptions: each tool's description is one literal that MCP clients and the VS Code extension's language model tools receive verbatim (packages/integrations/vscode/package.json is generated from it). rustfmt can't wrap a literal."
    metrics:
      filesystem.longest_line:
        max: 1014
