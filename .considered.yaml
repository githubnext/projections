    reason: "A shadcn/ui component kept as upstream (packages/host/core/src/ui/components/README.md): each element's or variant's Tailwind class list is one string, the form upstream ships and Tailwind's class sorting keeps, so diffs against upstream stay readable. oxfmt can't wrap a string."
