name: Check Projections
description: Build and verify the workspace (boundaries, file standards, formatting, builds, types, lint and the Node and Rust suites)
inputs:
  workspace:
    description: Workspace path relative to the repository checkout
    default: '.'
  native:
    description: Install optional collector toolchains and verify actual native tools and Docker isolation
    default: 'false'
  reference-docs:
    description: Check that the generated reference pages in docs/reference match their sources (needs a pinned nightly)
    default: 'false'
runs:
  using: composite
  steps:
    # The Rust suites, native toolchains and nightly outgrow a hosted runner's free disk.
    # Debug builds keep line tables (backtraces still have locations) and skip incremental caches,
    # which a one-off CI build never reuses.
    - shell: bash
      run: |
        echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
        echo CARGO_PROFILE_DEV_DEBUG=line-tables-only >> "$GITHUB_ENV"
    # On Linux, also remove preinstalled toolchains no check uses (Android, Haskell, Swift, Julia,
    # PyPy and CodeQL); Node, Rust, .NET, Java, Go, Python, Terraform, Docker and Chrome stay.
    - if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/ghc /usr/share/swift \
          /usr/local/julia* /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/setup-node@v6.5.0
      with:
        node-version-file: ${{ inputs.workspace }}/.node-version
        cache: npm
        cache-dependency-path: ${{ inputs.workspace }}/package-lock.json
    # The file standards in .considered.yaml, early because they need no install or build. tools/scripts/considered.mjs
    # downloads the pinned Considered release from GitHub and verifies its checksum; npm run check runs it again.
    - name: Considered
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        node tools/scripts/considered.mjs install
        node tools/scripts/considered.mjs check
    - if: inputs.native == 'true'
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 8.0.x
    - if: inputs.native == 'true'
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    - if: inputs.native == 'true'
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.25.7
        # The Go helper uses only the standard library and the native Go suite runs offline.
        cache: false
    - if: inputs.native == 'true'
      uses: actions/setup-java@v6.2.0
      with:
        distribution: temurin
        java-version: '21'
    - if: inputs.native == 'true'
      uses: gradle/actions/setup-gradle@v6.4.1
      with:
        # The Spring suite runs the fixture's build with Gradle on PATH, as a project without a wrapper would.
        gradle-version: 9.8.2
    - if: inputs.native == 'true'
      uses: hashicorp/setup-terraform@v4.0.1
      with:
        terraform_version: 1.14.7
        terraform_wrapper: false
    - shell: bash
      working-directory: ${{ inputs.workspace }}
      env:
        PROJECTIONS_CHECK_NATIVE: ${{ inputs.native }}
      run: |
        rustc --version
        cargo --version
        if [ "$PROJECTIONS_CHECK_NATIVE" = true ]; then
          python -m venv "$RUNNER_TEMP/projections-public-django"
          "$RUNNER_TEMP/projections-public-django/bin/python" -m pip install \
            -r packages/extractors/django-schema/helper/requirements.txt
          # The build must publish the prebuilt .NET helper rather than omit it.
          export PROJECTIONS_REQUIRE_HELPERS=1
          # The SCIP suite runs the project's indexer. The fixture was written with 0.6.1, which the package proxy
          # doesn't serve until it is a week old; 0.6.0 indexes the fixture identically.
          npm install --prefix "$RUNNER_TEMP/projections-scip" --no-audit --no-fund @sourcegraph/scip-typescript@0.6.0
          # The Spring suite also builds the fixture with Maven (the official distribution, checksum verified).
          # archive.apache.org sometimes resets connections, so downloads are retried.
          maven=apache-maven-3.9.16
          download() { curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "$@"; }
          download -o "$RUNNER_TEMP/$maven.tar.gz" "https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/$maven-bin.tar.gz"
          echo "$(download "https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/$maven-bin.tar.gz.sha512" | cut -d' ' -f1)  $RUNNER_TEMP/$maven.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$maven.tar.gz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/$maven/bin:$PATH"
        fi
        npm ci
        # Includes the Storybook build (tools/storybook/), which fails on any story or config error.
        npm run check
        # The opt-in native tool suites (packages/cli/tests/native_tools/) run once, with the Rust tests.
        if [ "$PROJECTIONS_CHECK_NATIVE" = true ]; then
          export PROJECTIONS_DJANGO_PYTHON="$RUNNER_TEMP/projections-public-django/bin/python"
          export PROJECTIONS_NATIVE_TESTS=1 PROJECTIONS_NATIVE_ECOSYSTEMS=1
          export PROJECTIONS_SCIP_TYPESCRIPT="$RUNNER_TEMP/projections-scip/node_modules/.bin/scip-typescript"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
        fi
        npm run test:rust
        npm run test:gh
        npm run test:packed
    # The repository's own projection (.github/projections/self-topology): its extractor's tests, then the CLI's
    # check of it end to end (extraction, determinism, scope, comparator tests and the renderer's checks in Chrome).
    - if: runner.os == 'Linux'
      name: Self-projection
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        node --test .github/projections/self-topology/
        packages/cli/dist/projections check -p self-topology --trust
        # The authoring surface: its files, rules language and CLI (self-authoring-api), and its TypeScript SDK.
        node --test .github/projections/self-authoring-api/
        packages/cli/dist/projections check -p self-authoring-api -p self-authoring-sdk --trust
    - if: inputs.reference-docs == 'true'
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        # The Rust SDK pages read rustdoc JSON, which needs the nightly the rust-public-api extractor is tested with.
        rustup toolchain install "$(node tools/scripts/reference-docs.mjs --nightly)" --profile minimal
        npm run docs:check
    - if: inputs.native == 'true'
      shell: bash
      working-directory: ${{ inputs.workspace }}
      env:
        PROJECTIONS_CONTAINER_IMAGE: node:26.12.1-bookworm-slim@sha256:88e480776c6149ff1d098cd304f44bf18057fb5d284a3329b78162d29821e28c
      run: |
        docker pull "$PROJECTIONS_CONTAINER_IMAGE"
        npm run test:container
