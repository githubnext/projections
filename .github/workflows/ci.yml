name: Projections
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, everything: what a pull request's plan left out still runs every day.
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
env:
  # Package sources (see CONTRIBUTING.md). The committed .npmrc covers the workspaces; this also covers
  # installs elsewhere, such as test scratch directories and --prefix installs.
  npm_config_registry: https://packagefeedproxy.microsoft.io/npm/
  # Vulnerabilities are gated by dependency review and Dependabot (SECURITY.md), not npm's audit endpoint.
  npm_config_audit: 'false'
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
# A newer commit on a pull request cancels the older one's run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# What runs (CONTRIBUTING.md#what-ci-runs): a pull request runs the jobs its change reaches, which `changes` works out
# by applying the rules in .github/ci-rules.json to the workspace and crate graph (tools/scripts/ci-plan.mjs). Pushes to
# main, the nightly run, a manual run, the `ci:full` label and any change to CI itself, a toolchain, a lockfile, a root
# manifest or the repository's tooling run everything. `ci-ok` is the one required check: it passes when every job
# passed or was left out.
jobs:
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # By job ID, the rules' decision for each job (.github/ci-rules.json); public-product's is its matrix of runners.
    outputs:
      docs: ${{ steps.plan.outputs.docs }}
      public-product: ${{ steps.plan.outputs.public-product }}
      verus: ${{ steps.plan.outputs.verus }}
      windows: ${{ steps.plan.outputs.windows }}
      windows-node: ${{ steps.plan.outputs.windows-node }}
      windows-integration: ${{ steps.plan.outputs.windows-integration }}
      package: ${{ steps.plan.outputs.package }}
      release-config: ${{ steps.plan.outputs.release-config }}
      coverage: ${{ steps.plan.outputs.coverage }}
      mutants-diff: ${{ steps.plan.outputs.mutants-diff }}
      actions-lock: ${{ steps.plan.outputs.actions-lock }}
      browser: ${{ steps.plan.outputs.browser }}
      browser-macos: ${{ steps.plan.outputs.browser-macos }}
    steps:
      # A pull request checks out its merge commit: its first parent is the base branch, so the change is HEAD^1..HEAD.
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      # The plan needs Node alone: no install or build.
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            node tools/scripts/ci-plan.mjs --base HEAD --event "$EVENT" --plan "$RUNNER_TEMP/ci-plan.json"
            exit
          fi
          # Read now, not from the event, so that adding a label and re-running the workflow takes effect.
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq 'map(.name) | join(",")')
          node tools/scripts/ci-plan.mjs --base HEAD^1 --labels "$labels" --plan "$RUNNER_TEMP/ci-plan.json"
      # The plan and the checks it runs, with each file's class and rule: what this run decided and why, after the fact.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan.json
          retention-days: 90
  # A change to documentation alone: the checks that read it, without a build.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - shell: bash
        run: |
          npm ci --no-audit --no-fund
          node tools/scripts/considered.mjs install
          npm run --silent check:considered
          npm run --silent format:check
          # The example sources under docs/ (no workspace's declarations needed, so no build); the rest lints after the
          # build in public-product.
          npx eslint --quiet docs
          npm run --silent check:boundaries
          npm run --silent check:casing
          npm run --silent check:readmes
          npm run --silent check:links
  public-product:
    needs: changes
    if: needs.changes.outputs.public-product != '[]'
    name: public-product (${{ matrix.name }})
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        # The entries the rules choose: public-product's matrix in .github/ci-rules.json. Each names its runner (os)
        # and the part of the check it runs: all on Linux; on macOS, the Rust suites and the rest in parallel.
        include: ${{ fromJson(needs.changes.outputs.public-product) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/check
        with:
          native: ${{ runner.os == 'Linux' }}
          reference-docs: ${{ runner.os == 'Linux' }}
          part: ${{ matrix.part }}
      # The GitHub Action itself, with the CLI the check built: a pull request in a small repository.
      - if: matrix.part != 'rust'
        uses: $/.github/actions/action-e2e
      # The repository's own CLI (tools/cli/README.md) keeps working, and every workspace and crate README
      # keeps the front matter description it reads.
      - name: tools doctor and README descriptions
        if: matrix.part != 'rust'
        shell: bash
        run: |
          npm run --silent tools -- doctor
          npm run --silent tools -- --llms > /dev/null
          npm run --silent check:readmes
  # Every JSON, YAML and TOML file against its schema (.dollarlint.toml, CONTRIBUTING.md#schemas-for-data-files), on
  # every change: it takes seconds and needs no build. Findings go to code scanning too, except from forks, whose token
  # can't upload them.
  dollarlint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      # .oxfmtrc.json's schema is the one in the installed oxfmt package.
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Remote schemas (SchemaStore and the others .dollarlint.toml allows), fetched at most once a day.
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/dollarlint
          key: dollarlint-schemas-${{ steps.day.outputs.day }}
          restore-keys: dollarlint-schemas-
      - uses: dollarlint/dollarlint@v0.1.28
        with:
          upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # The vulnerability gate: a pull request may not add a dependency with a known high or critical advisory (npm, Cargo
  # and the other manifests GitHub's dependency graph reads). It uses the dependency graph, not an npm audit endpoint;
  # Dependabot (.github/dependabot.yml) covers what is already locked.
  dependency-review:
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
  # The workflow dependency lockfile, .github/workflows/actions.lock (CONTRIBUTING.md#workflow-dependency-lockfile):
  # every action the workflows use, directly or through another action, is locked, and every locked commit still
  # verifies upstream. Nightly too, so a release tag that moves upstream is noticed.
  actions-lock:
    needs: changes
    if: needs.changes.outputs.actions-lock == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      # Never runs: it locks, for this workflow, the actions of the GitHub Action, which action-e2e runs as `./`.
      - if: false
        uses: $/.github/actions/action-dependencies
      # action-e2e's `./` is the one local action; every other is `$/`, which the lockfile follows.
      - name: Verify the workflow dependency lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify --ignore-local-actions
  # Known advisories in what is already locked: OSV (GitHub's advisories for npm, RustSec's for crates) against the root
  # package-lock.json and Cargo.lock, nightly and on main. Pull requests rely on dependency review above.
  advisories:
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
      - run: npm run --silent check:advisories
  # Verus proves the Engine's verified crate and the mutation check plants one bug per specification clause
  # (packages/engine/VERIFICATION.md), when a change reaches the Engine's crates. It needs no npm install or build, so it
  # runs alongside the other jobs.
  verus:
    needs: changes
    if: needs.changes.outputs.verus == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/verus
  # The browser suites: native Chromium and WebKit, desktop and mobile. The jobs, and how the large suites are sharded,
  # are the plan's (tools/cli/src/lib/ci-browser.ts): each affected suite, and `rest` for every other affected browser
  # suite. A change to renderers alone leaves the other renderers' tests out of the renderer harness.
  browser:
    needs: changes
    if: needs.changes.outputs.browser != '[]'
    name: browser (${{ matrix.name }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.browser) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/browser
        with:
          suite: ${{ matrix.suite }}
          project: ${{ matrix.project }}
          shard: ${{ matrix.shard }}
          grep-invert: ${{ matrix.grepInvert }}
          sharded: ${{ matrix.except }}
  # @githubnext/projections, the one npm package, as it would be published (docs/contracts/packages.md).
  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/package
  # The release workflow is generated by dist; it must match dist-workspace.toml. Pull requests don't run it
  # (pr-run-mode), so this also plans the release, as its first job would.
  release-config:
    needs: changes
    if: needs.changes.outputs.release-config == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
      - name: Install the dist version dist-workspace.toml pins
        shell: bash
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      - name: Check the release workflow is what dist generates
        shell: bash
        run: node tools/scripts/dist.mjs --check
      - name: Plan the release
        shell: bash
        run: dist plan
  # Native Windows: Job Object supervision, no-follow artifact I/O and the Rust suites
  # that don't run POSIX shell scripts (those are ignored on Windows with their reason).
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - shell: bash
        run: |
          rustup toolchain install
          # The suites read the built comparators and browser client.
          npm ci --no-audit --no-fund
          npm run build
          # Which Python launchers this runner has: the Python suites run python3 through the CLI's resolution
          # (packages/cli/src/python.rs), which finds python or py -3 where python3 is missing.
          for launcher in python3 python py; do echo "$launcher: $(command -v "$launcher" || echo none)"; done
          cargo test --locked --workspace --no-fail-fast
  # Native Windows, Node: every workspace's Node suites, the CLI's own (its Rust suites run in `windows`), the installed
  # CLI proof, and the checks whose result can depend on the platform (paths, file names, line endings, processes). The
  # checks that read only text (format, lint, types, considered, generated docs) give the same result everywhere and run
  # on Linux and macOS in public-product.
  windows-node:
    needs: changes
    if: needs.changes.outputs.windows-node == 'true'
    timeout-minutes: 90
    runs-on: windows-2025
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - shell: bash
        run: |
          rustup toolchain install
          npm ci --no-audit --no-fund
          npm run build
      - name: Checks that read the file system
        shell: bash
        run: |
          npm run --silent check:portability
          npm run --silent check:boundaries
          npm run --silent check:casing
          npm run --silent check:machines
          npm run --silent check:readmes
          npm run --silent check:links
          npm run --silent check:versions
          npm run --silent check:comparators
      - name: Node suites
        shell: bash
        run: |
          # Every suite runs, so one job reports each failure. packages/cli's test script also runs its Rust suites,
          # which run in `windows`; its Node suites run on their own here.
          status=0
          npm test -- --except packages/cli --keep-going || status=1
          # One file at a time, each failure reported where it happens (TAP), and a test that hangs fails by name; the
          # run ends when the tests do, whatever handles a failed test left open.
          node --test --test-concurrency=1 --test-timeout=300000 --test-force-exit --test-reporter=tap \
            packages/cli/test/*.test.mjs || status=1
          npm run test:installed || status=1
          exit $status
  # Native Windows, end to end: the CLI's browser suite (its view server, starter renderer and Inspector in Chromium)
  # and one renderer's browser suite as a smoke test of the renderers on Windows (they run in full on Linux in
  # `browser`), the VS Code extension's smoke test in a downloaded VS Code, then the GitHub Action itself
  # (.github/actions/action-e2e), as public-product runs it on Linux and macOS.
  windows-integration:
    needs: changes
    if: needs.changes.outputs.windows-integration == 'true'
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - shell: bash
        run: |
          rustup toolchain install
          npm ci --no-audit --no-fund
          npm run build
      - name: Browser smoke test
        shell: bash
        run: |
          tools/scripts/install-browsers.sh chromium
          npm run test:browser --workspace @githubnext/projections-cli
          npm run test:browser --workspace @githubnext/projections-renderer-harness -- --project=chromium-desktop code-statistics/
      - name: VS Code extension smoke test
        # Each step reports on its own: one failing doesn't hide the others' results.
        if: ${{ !cancelled() }}
        shell: bash
        run: npm run test:vscode --workspace projections-vscode
      # A python.org install on Windows has python and py, not python3, which the runner image adds: without it, the
      # fixture's ["python3", ...] extractor runs through the CLI's resolution, as on a typical Windows machine.
      - name: Remove python3, as a standard Windows install has none
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rm "$(dirname "$(command -v python)")/python3.exe"
          # What remains is at most the Microsoft Store's python3 alias, which runs no Python.
          if python3 --version 2>/dev/null | grep -q '^Python 3'; then exit 1; fi
      - if: ${{ !cancelled() }}
        uses: $/.github/actions/action-e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-browser-failure-Windows-integration
          path: |
            packages/cli/test-results/
            packages/renderers/harness/test-results/
          if-no-files-found: ignore
          retention-days: 7
  # WebKit on macOS, the platform Safari runs on: the renderer harness's desktop WebKit project, which runs on Linux
  # WebKit in `browser`. Its tests take 10 to 30 minutes on a macOS runner, whose speed varies, after a 15-minute
  # build: two shards keep each job well inside its limit. Like `browser`, it leaves the other renderers' tests out for a
  # change to renderers alone.
  browser-macos:
    needs: changes
    if: needs.changes.outputs.browser-macos != '[]'
    name: browser-macos (${{ matrix.name }})
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.browser-macos) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/browser
        with:
          suite: ${{ matrix.suite }}
          project: ${{ matrix.project }}
          shard: ${{ matrix.shard }}
          grep-invert: ${{ matrix.grepInvert }}
  # The core Engine's and default comparator's coverage thresholds, when a change reaches them
  # (packages/engine/TESTING.md).
  coverage:
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-quality
        with:
          task: coverage
  # Mutation testing of the pull request's diff, when it changes a file .cargo/mutants.toml examines, in 6 round-robin
  # shards; the plan runs it on pull requests alone and lists its shards (mutants-diff in .github/ci-rules.json).
  # Measured on a 674-mutant diff (one unsharded run, cancelled at its 60-minute timeout): mutants 460 and 518 finished
  # 43 and 52 minutes in, about 10 a minute with --jobs 2 and 7 in the slowest file, so the whole diff needs ~75
  # minutes. A shard of ~113 takes 12-17 minutes plus ~3 of setup and baseline, well inside its 60, and leaves room for
  # diffs up to ~1,500 mutants; past that, raise the count here, in the matrix and in the rules. Cost: 6 runners for
  # ~20 minutes, ~120 runner-minutes a pull request push. The weekly full run is engine-quality.yml.
  mutants-diff:
    needs: changes
    if: needs.changes.outputs.mutants-diff == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/rust-quality
        with:
          task: mutants-diff
          base-ref: ${{ github.base_ref }}
          shard: ${{ matrix.shard }}/6
          artifact: mutants-diff-${{ matrix.shard }}
  # The miss detector (CONTRIBUTING.md#what-ci-runs), on a push to main once every other job has finished: for each job
  # that failed, did the merged pull request's plan (its `ci-plan` artifact) skip it, and did it pass on the parent
  # commit? Then the rules probably missed what the change reaches. Report-only: it writes the run's summary and a
  # warning, and never fails, files an issue or re-runs anything.
  ci-miss:
    if: always() && github.event_name == 'push'
    needs:
      - changes
      - docs
      - public-product
      - dollarlint
      - dependency-review
      - actions-lock
      - advisories
      - verus
      - browser
      - package
      - release-config
      - windows
      - windows-node
      - windows-integration
      - browser-macos
      - coverage
      - mutants-diff
    continue-on-error: true
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/scripts/ci-miss.mjs
  # The one required check. It fails unless `changes` succeeded and every other job passed or was left out by the plan:
  # a failed, cancelled or timed-out job fails it, and a skipped one doesn't.
  ci-ok:
    if: always()
    needs:
      - changes
      - docs
      - public-product
      - dollarlint
      - dependency-review
      - actions-lock
      - advisories
      - verus
      - browser
      - package
      - release-config
      - windows
      - windows-node
      - windows-integration
      - browser-macos
      - coverage
      - mutants-diff
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and (.key == "changes" or .value.result != "skipped")) | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed, cancelled or not run: $failed"
            exit 1
          fi
