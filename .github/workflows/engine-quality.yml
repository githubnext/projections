# The weekly full mutation run of the core Engine and default comparator. Coverage and mutation testing of a pull
# request's diff run in ci.yml (`coverage`, `mutants-diff`), when the change reaches them.
name: Engine quality
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  # Package sources (see CONTRIBUTING.md). The committed .npmrc covers the workspaces; this also covers
  # installs elsewhere, such as test scratch directories and --prefix installs.
  npm_config_registry: https://packagefeedproxy.microsoft.io/npm/
  # Vulnerabilities are gated by dependency review and Dependabot (SECURITY.md), not npm's audit endpoint.
  npm_config_audit: 'false'
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-quality
        with:
          task: mutants
          shard: ${{ matrix.shard }}/4
          artifact: mutants-${{ matrix.shard }}
