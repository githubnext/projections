name: Release inputs
# A dist plan job (plan-jobs in dist-workspace.toml). It builds the platform-neutral
# inputs every release executable embeds, once, so every platform embeds identical
# bytes: the Inspector client with renderer bundles and notices, the default
# comparator, and the .NET and TypeScript helpers. It also builds the VS Code
# extension's platform-neutral code, which each proof job packages with its own
# executable.
on:
  workflow_call:
permissions: {}
env:
  # Package sources (see CONTRIBUTING.md). The committed .npmrc covers the workspaces; this also covers
  # installs elsewhere, such as test scratch directories and --prefix installs.
  npm_config_registry: https://packagefeedproxy.microsoft.io/npm/
  # Vulnerabilities are gated by dependency review and Dependabot (SECURITY.md), not npm's audit endpoint.
  npm_config_audit: 'false'
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Pull requests only plan a release unless pr-run-mode builds it.
      - id: needed
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || grep -q '^pr-run-mode = "upload"' dist-workspace.toml; then
            echo build=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.needed.outputs.build == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - if: steps.needed.outputs.build == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - if: steps.needed.outputs.build == 'true'
        shell: bash
        env:
          PROJECTIONS_REQUIRE_HELPERS: '1'
          # A release tag, which every shipped manifest's version must match; none on a dry run.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          npm ci --no-audit --no-fund
          # Before anything is built: every shipped manifest, their dependencies on each other and both lockfiles carry
          # one version, the tag's (docs/maintainers/releasing.md).
          npm run --silent tools -- version ${TAG:+--tag "$TAG"}
          npm run build
      - if: steps.needed.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded-inputs
          if-no-files-found: error
          retention-days: 7
          # upload-artifact roots the artifact at these paths' common ancestor, packages/, which is where the release
          # build setup and the release proof download it. Keep every path under packages/.
          path: |
            packages/host/inspector/dist/client/
            packages/integrations/mcp-apps/dist/viewer.html
            packages/comparators/default/dist/default-comparator.wasm
            packages/extractors/dotnet-support/helper/publish/
            packages/extractors/typescript-support/dist/extractor.mjs
            packages/comparators/rules/dist/rules.wasm
            packages/comparators/rules/dist/THIRD_PARTY_NOTICES.txt
      - if: steps.needed.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          if-no-files-found: error
          retention-days: 7
          path: packages/integrations/vscode/dist/
