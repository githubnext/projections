# Release builds with dist (axodotdev cargo-dist). `dist generate` writes
# .github/workflows/release.yml from this file; never edit that workflow by hand.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
# Only the CLI is released; every other workspace crate is part of it.
packages = ["projections-cli"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
precise-builds = true
# Pull requests run no release jobs: ci.yml plans the release when a change can affect it (release-config).
pr-run-mode = "skip"
# Required: the default would publish a tarball of the whole repository.
source-tarball = false
installers = ["shell", "powershell"]
install-path = ["$PROJECTIONS_INSTALL_DIR/", "~/.projections/bin"]
install-updater = false
# dist attests the CLI archives as it builds them, which also keeps its build jobs' token read-only; every
# release asset, the archives again among them, is attested once a person approves the release (release-approval.yml).
github-attestations = true
# The release is created only after every native proof passes (see release-proof.yml).
github-release = "announce"
# Required: without it dist skips publish jobs, release-approval among them, for a prerelease, and announces it
# unapproved.
publish-prereleases = true
# Platform-neutral inputs every executable embeds are built once, then each build
# downloads them and embeds the extractor helpers.
plan-jobs = ["./release-inputs"]
github-build-setup = "../release-build-setup.yml"
# Each native executable is proved on its own platform and published under its gh
# precompiled-extension name; @githubnext/projections is packed, proved and attached
# as githubnext-projections-<version>.tgz, which renderers depend on by URL.
global-artifacts-jobs = ["./release-proof"]
# Once every artifact is proved, the release waits for a person to approve the `release` environment, which
# attests the assets; dist announces only then (release-approval.yml, docs/maintainers/releasing.md).
publish-jobs = ["./release-approval"]
# Once the release is announced, its JSON Schemas are published to the schemas host
# (publish-schemas.yml, docs/maintainers/schema-publishing.md) and @githubnext/projections to npm
# (publish-npm.yml, docs/maintainers/npm-publishing.md; inert until npm publishing is approved), and a stable
# release moves its major version tag, v0, which `uses: githubnext/projections@v0` follows (move-major-tag.yml).
post-announce-jobs = ["./publish-schemas", "./publish-npm", "./move-major-tag"]
github-custom-job-permissions = { "release-proof" = { contents = "read" }, "release-approval" = { actions = "read", attestations = "write", id-token = "write" }, "publish-schemas" = { contents = "read", id-token = "write" }, "publish-npm" = { contents = "read", id-token = "write" }, "move-major-tag" = { contents = "read" } }

[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-pc-windows-msvc = "windows-2025"
aarch64-pc-windows-msvc = "windows-11-arm"

[dist.github-action-commits]
"actions/checkout" = "v6.1.0"
"actions/upload-artifact" = "v7.0.2"
"actions/download-artifact" = "v8.0.2"
"actions/attest" = "v4.2.2"
