name: CI
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps: [{run: npm run lint}]
  test:
    runs-on: ubuntu-latest
    steps: [{run: npm test}]
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps: [{run: npm run build}]
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps: [{run: npm run deploy}]
