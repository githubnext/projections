# Template: run the renderer's browser checks in CI. Copy it into your renderer's repository.
name: Renderer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build
      # The checks run the native `projections` CLI, which isn't on npm: install the release whose version matches
      # @githubnext/projections (docs/setup/install.md) and put it on PATH, or set PROJECTIONS_CLI to its path.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
