[package]
name = "projections-comparator-runtime"
publish = false
description = "Sandboxed WebAssembly comparator host for Projections"
version.workspace = true
edition.workspace = true
license.workspace = true
# wasmi 2 requires Rust 1.86.
rust-version = "1.86"
exclude = ["js"]

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch", "deterministic"] }
# Only for naming `LimiterError` in the `ResourceLimiter` implementation; the same crate wasmi uses.
wasmi_core = { version = "2.0.0", default-features = false }

[dev-dependencies]
wat = "1"
