[package]
name = "projections-extractor-rails-routes"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
projections-extractor-ruby-support = { path = "../ruby-support" }
projections-extractor-sdk = { path = "../sdk" }
regex = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
projections-engine = { path = "../../engine" }
projections-extractor-sdk = { path = "../sdk", features = ["testing"] }
tempfile = "3"
