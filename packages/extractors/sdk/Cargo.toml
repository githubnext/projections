[package]
name = "projections-extractor-sdk"
publish = false
description = "Write Projections extractors in Rust: the extractor request and process, repository paths and extraction values"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["projections", "extractor", "code-review"]
categories = ["development-tools"]

[dependencies]
anyhow = "1"
# The Engine's strict JSON parser, which rejects duplicate keys and unsafe numbers.
projections-engine = { path = "../../engine", version = "0.1.0", default-features = false }
regex = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Test contexts and golden-file helpers for extractor tests.
testing = []

[dev-dependencies]
tempfile = "3"
