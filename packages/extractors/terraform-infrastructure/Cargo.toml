[package]
name = "projections-extractor-terraform-infrastructure"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
projections-extractor-sdk = { path = "../sdk" }
regex = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
projections-comparator-default = { path = "../../comparators/default" }
projections-engine = { path = "../../engine" }
projections-extractor-sdk = { path = "../sdk", features = ["testing"] }
