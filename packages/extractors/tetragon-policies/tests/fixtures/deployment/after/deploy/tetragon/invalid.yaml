# Rejected by the repository's CRD: an unknown action and a bad option name.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: shell-guard
  namespace: payments
spec:
  options:
    - name: Policy_Mode
      value: enforce
  kprobes:
    - call: sys_execve
      selectors:
        - label: shells
          matchBinaries:
            - operator: In
              values: [/bin/sh]
          matchActions:
            - action: Explode
