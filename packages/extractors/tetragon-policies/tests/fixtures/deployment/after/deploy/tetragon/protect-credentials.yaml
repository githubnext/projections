# Sample for the eBPF policy projection proposal (head revision).
# The pull request:
#   1. kills curl and wget when they read the service account token;
#   2. extends the policy from payments to payments and checkout workloads;
#   3. drops the security_mmap_file probe.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: protect-credentials
spec:
  options:
    - name: policy-mode
      value: enforce
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: [payments, checkout]
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      message: 'Credential file read'
      tags: ['credentials', 'file']
      args:
        - index: 0
          type: file
        - index: 1
          type: int # MAY_READ = 4, MAY_WRITE = 2
      returnArg:
        index: 0
        type: int
      selectors:
        - label: ssh-keys-read
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /root/.ssh
                - /home
            - index: 1
              operator: Equal
              values: ['4']
        - label: token-read-by-downloader
          matchBinaries:
            - operator: In
              values:
                - /usr/bin/curl
                - /usr/bin/wget
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/run/secrets/kubernetes.io/serviceaccount
            - index: 1
              operator: Equal
              values: ['4']
          matchActions:
            - action: Sigkill
