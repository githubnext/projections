# Sample for the eBPF policy projection proposal (base revision).
# Observes reads of credential material by payments workloads.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: protect-credentials
spec:
  options:
    - name: policy-mode
      value: enforce
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: payments
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      message: 'Credential file read'
      tags: ['credentials', 'file']
      args:
        - index: 0
          type: file
        - index: 1
          type: int # MAY_READ = 4, MAY_WRITE = 2
      returnArg:
        index: 0
        type: int
      selectors:
        - label: ssh-keys-read
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /root/.ssh
                - /home
            - index: 1
              operator: Equal
              values: ['4']
    - call: security_mmap_file
      syscall: false
      message: 'Credential file mapped'
      tags: ['credentials', 'file']
      args:
        - index: 0
          type: file
        - index: 1
          type: uint32
      selectors:
        - label: token-mapped
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/run/secrets/kubernetes.io/serviceaccount
