[package]
name = "projections-extractor-workspace-dependencies"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
projections-extractor-sdk = { path = "../sdk" }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1"

[dev-dependencies]
projections-extractor-sdk = { path = "../sdk", features = ["testing"] }
